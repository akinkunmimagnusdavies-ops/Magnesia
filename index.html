<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnesia Group of Companies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
 <div class="head">
  <div><a href="/" class="logo-img"><img src="images/logo.png" alt="Business Logo" width="130" height="130"></a></div>
  <nav id="mainNav">
   <div class="nav-close" id="closeNav">✕</div>
   <ul class="nav-links">
    <li><a href="#" data-filter="all" class="active">All Products</a></li>
    <li><a href="#" data-filter="cakes">Cakes</a></li>
    <li><a href="#" data-filter="birthday-cakes">Birthday Cakes</a></li>
    <li><a href="#" data-filter="deserts">Deserts</a></li>
    <li><a href="#" data-filter="shoe-wipes">Shoe Wipes</a></li>
    <li><a href="#cart" class="cart-icon" id="openCart"> Cart (<span id="cartCount">0</span>)</a></li>
   </ul>
  </nav>
  <div class="menu-btn" id="menuBtn">☰</div>
 </div>
</header>

<div id="cartDrawer" class="cart-drawer">
 <div class="cart-header"><h3>Your Cart</h3><span id="closeCart">✕</span></div>
 <div id="cartItems"></div>
 <div class="cart-footer">
  <p>Total: ₦<span id="cartTotal">0</span></p>
  <input type="email" id="customerEmail" placeholder="Enter your email for receipt">
  <button id="paystackBtn">Pay with Paystack</button>
  <button id="checkoutBtn">Checkout on WhatsApp</button>
 </div>
</div>
<div id="drawerOverlay"></div>

<input type="text" id="searchInput" placeholder="Search products... e.g. cakes, wipes, desert">

<section class="best-section">
  <div class="best-header"><h2>Best Sellers 🔥</h2><p>Most ordered this week</p></div>
  <div class="best-wrapper">
    <button class="scroll-btn left">‹</button>
    <div class="best-track" data-filter="bestSeller"></div>
    <button class="scroll-btn right">›</button>
  </div>
</section>

<section class="main-products">
 <h1 class="products-head">Our Products</h1>
 <div class="grid-container" id="productGrid"></div>
</section>

<section class="contact-section">
  <div class="contact">
    <h1>Contact Us</h1>
    <form id="contactForm">
     <input type="text" name="name" id="name" placeholder="Enter Your Name" required>
     <input type="tel" name="phone" id="number" placeholder="Enter Your Number" required>
     <textarea name="info" id="info" rows="6" placeholder="Tell us what you need...we are rugged enof to take ya orders. Awu!"></textarea>
     <button type="submit" class="contact-btn">Submit</button>
     <p id="formMsg"></p>
    </form>
  </div>
</section>

<div id="productModal" class="modal">
  <div class="modal-content">
    <span id="closeModal">&times;</span>
    <img id="modalImg" src="" alt="">
    <h2 id="modalName"></h2>
    <p id="modalSize"></p>
    <p id="modalDesc"></p>
    <p><strong>Price:</strong> ₦<span id="modalWholesale"></span></p>
    <button id="modalAddToCart">Add to Cart</button>
  </div>
</div>

<footer>
  <div class="footer-container">
    <p><small>&copy; 2026 Magnesia Group of Companies</small></p>
    <p><small>All Rights Reserved</small></p>
    <p><small><a href="privacy.html">Privacy Policy</a></small></p>
  </div>
</footer>

<template id="product-card-template">
  <div class="card">
    <img class="tpl-img" alt="" loading="lazy">
    <fieldset>
      <p class="tpl-name"></p>
      <p><small class="tpl-size"></small></p>
      <p><small class="tpl-price"></small></p>
      <button class="cart-btn tpl-cart-btn">Add to Cart</button>
      <button class="details-btn tpl-details-btn">Details</button>
    </fieldset>
  </div>
</template>

<template id="best-card-template">
  <div class="best-card">
    <span class="badge-best">BEST</span>
    <img class="tpl-img" alt="">
    <p class="b-name tpl-name"></p>
    <p class="b-price tpl-price"></p>
    <button class="b-btn tpl-cart-btn">Add</button>
  </div>
</template>

<template id="cart-item-template">
  <div class="cart-item">
    <span class="tpl-title"></span>
    <span class="cart-item-right">
      <span class="tpl-price"></span>
      <button class="cart-item-remove tpl-remove-btn">✕</button>
    </span>
  </div>
</template>

<template id="empty-state-template">
  <p class="empty-state"></p>
</template>

<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="js/script.js"></script>
</body>
</html>
